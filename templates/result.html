<!DOCTYPE html>
<html>
<head>
    <title>Fraud Detection Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Transaction Result</h1>

        {% if prediction == 1 %}
            <h2 style="color:red;">⚠ Fraud Transaction Detected!</h2>
        {% else %}
            <h2 style="color:green;">✓ Genuine Transaction</h2>
        {% endif %}

        <a href="/">Go Back</a>
    </div>
</body>
</html>
